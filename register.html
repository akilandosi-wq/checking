<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="register"><header><div class="nav"><a class="brand" href="index.html">Connect</a><nav><a href="index.html">Home</a><a href="login.html">Login</a></nav></div></header>
<main class="narrow"><div class="page-heading"><h1>Create your account</h1><p>Only the details needed to get started.</p></div>
<form id="registerForm" class="card"><label>Display name<input name="display_name" maxlength="60" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit">Create account</button><p class="muted small">Use the community respectfully and keep your personal information private.</p></form>
<p class="small muted">Already registered? <a href="login.html">Log in</a>.</p></main><footer>Account registration</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script></body></html>
